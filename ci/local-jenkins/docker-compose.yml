version: '3.8'

services:
  jenkins:
    build:
      context: .
    container_name: local-jenkins
    user: "0:0"
    restart: unless-stopped
    # Use port mapping on Windows instead of host network mode
    ports:
      - "8081:8081"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../../:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube:/var/jenkins_home/.kube:ro
      - ${HOME}/.minikube:${HOME}/.minikube:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--httpPort=8081
      - KUBECONFIG=/var/jenkins_home/.kube/config

volumes:
  jenkins_home:
